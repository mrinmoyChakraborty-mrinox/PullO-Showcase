  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Load React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Load Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts requires Prop-Types -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <!-- Recharts Library -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  
  <!-- Google Fonts: Inter and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    // Customize Tailwind to use our Google Fonts
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom page transition and scrollbar effects */
    body {
      background-color: #070914;
      color: #F8FAFC;
    }

    .analytics-glow {
      position: relative;
    }

    .analytics-glow::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.05);
      pointer-events: none;
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    .analytics-glow:hover::after {
      opacity: 1;
    }

    /* Custom pulse animation for the latest live request dot */
    @keyframes liveRequestPulse {
      0% {
        r: 4.5px;
        opacity: 0.7;
      }
      50% {
        opacity: 0.4;
      }
      100% {
        r: 15px;
        opacity: 0;
      }
    }

    .live-request-pulse-1 {
      animation: liveRequestPulse 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .live-request-pulse-2 {
      animation: liveRequestPulse 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      animation-delay: 0.8s;
    }

    @media (prefers-reduced-motion: reduce) {
      .live-request-pulse-1,
      .live-request-pulse-2 {
        animation: none;
        opacity: 0;
      }
    }

    /* Custom fade animation for data updates */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    /* Scrollbar customization */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 19, 34, 0.5);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.2);
      border-radius: 3px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.4);
    }
  </style>
</head>

    // --- CUSTOM DECORATIVE GRAPHICS FOR RECHARTS ---
    const CustomLiveRequestDot = (props) => {
      const { cx, cy, index } = props;
      if (!cx || !cy) return null;

      const isLast = index === liveRequestData.length - 1;

      return (
        <g>
          {isLast && (
            <>

                cx={cx}
                cy={cy}
                r={5.5}
                fill="none"
                stroke="#8B5CF6"

                strokeWidth={1}

    const CustomBarShape = (props) => {
      const { x, y, width, height } = props;
      if (width <= 0 || height <= 0) return null;

      const rTop = 6;
      const rBot = 2;
      const pathData = `
        M ${x}, ${y + rTop}
        Q ${x}, ${y} ${x + rTop}, ${y}
        L ${x + width - rTop}, ${y}
        Q ${x + width}, ${y} ${x + width}, ${y + rTop}
        L ${x + width}, ${y + height - rBot}
        Q ${x + width}, ${y + height} ${x + width - rBot}, ${y + height}
        L ${x + rBot}, ${y + height}
        Q ${x}, ${y + height} ${x}, ${y + height - rBot}
        Z
      `.replace(/\s+/g, " ");

            width={width + 6}

    // --- APPLICATION MAIN CONTAINER ---
    function App() {
      const [selectedRange, setSelectedRange] = useState("7d");
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [lastUpdated, setLastUpdated] = useState("Just now");
      const [activeData, setActiveData] = useState(mockData7d);
      const [fadeKey, setFadeKey] = useState(0);

      const [isLiveChartVisible, setIsLiveChartVisible] = useState(false);
      const liveChartRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsLiveChartVisible(true);
              observer.disconnect();
            }
          },
          { threshold: 0.05 }
        );

        if (liveChartRef.current) {
          observer.observe(liveChartRef.current);
        }

        return () => observer.disconnect();
      }, []);

      useEffect(() => {
        switch (selectedRange) {
          case "24h":
            setActiveData(mockData24h);
            break;
          case "30d":
            setActiveData(mockData30d);
            break;
          case "7d":
          default:
            setActiveData(mockData7d);
            break;
        }
        setFadeKey((prev) => prev + 1);
      }, [selectedRange]);

      const handleRefresh = () => {
        if (isRefreshing) return;
        setIsRefreshing(true);
        
        setTimeout(() => {
          setIsRefreshing(false);
          const now = new Date();
          const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setLastUpdated(`at ${timeString}`);
          setFadeKey((prev) => prev + 1);
        }, 850);
      };

      const formatYAxis = (value) => {
        if (value >= 1000000) return `${(value / 1000000).toFixed(1)}M`;
        if (value >= 1000) return `${(value / 1000).toFixed(0)}K`;
        return `${value}`;
      };

      const CustomTooltip = ({ active, payload, label }) => {
        if (active && payload && payload.length) {
          return (
            <div className="bg-[#121728] border border-[rgba(139,92,246,0.3)] text-slate-100 p-3 rounded-lg shadow-xl text-xs font-sans backdrop-blur-md">
              <p className="text-slate-400 mb-1.5 font-medium">{label}</p>
              {payload.map((item, idx) => (
                <div key={idx} className="flex items-center gap-2 mt-0.5">
                  <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: item.color || item.fill }} />
                  <span className="text-slate-300">
                    {item.name}: <span className="font-semibold text-slate-100">{item.value.toLocaleString()}</span>
                  </span>
                </div>
              ))}
            </div>
          );
        }
        return null;
      };

      return (

                <div className="p-2.5 bg-gradient-to-tr from-[#7C3AED]/20 to-[#A855F7]/10 border border-[rgba(139,92,246,0.2)] rounded-lg text-[#8B5CF6]">
                  <IconActivity className="w-6 h-6 animate-pulse" />
                </div>
                <div>
                  <h1 className="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    Analytics
                  </h1>
                  <p className="text-sm text-[#94A3B8]">
                    Monitor usage, performance, and errors in real time.
                  </p>
                </div>
              </div>

              {/* Header Controls */}
              <div className="flex items-center flex-wrap gap-2">
                <div className="bg-[#121728] border border-[rgba(255,255,255,0.08)] rounded-lg p-1 flex items-center">
                  {["24h", "7d", "30d"].map((range) => (
                    <button
                      key={range}
                      onClick={() => setSelectedRange(range)}
                      className={`px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 cursor-pointer ${
                        selectedRange === range
                          ? "bg-[#8B5CF6] text-white shadow-lg shadow-[#8B5CF6]/20"
                          : "text-[#94A3B8] hover:text-white"
                      }`}
                    >
                      {range}
                    </button>
                  ))}
                </div>

                <button className="px-3 py-2 bg-[#121728] border border-[rgba(255,255,255,0.08)] hover:border-[rgba(139,92,246,0.3)] text-[#F8FAFC] rounded-lg transition-all text-xs font-medium flex items-center gap-2 cursor-pointer hover:bg-[#1a2036]">
                  <IconCalendar className="w-4 h-4 text-[#94A3B8]" />
                  <span>
                    {selectedRange === "24h" && "Jul 6, 2024"}
                    {selectedRange === "7d" && "Jun 30 - Jul 6, 2024"}

                      <span className="text-[10px] text-[#94A3B8]">vs prev period</span>
                    </div>
                  </div>
                  <div className="w-20 h-10">
                    <ResponsiveContainer width="100%" height="100%">

                    <div className="flex items-center gap-1.5 mt-1.5">
                      <span className="text-xs font-semibold px-1.5 py-0.5 rounded bg-[#22C55E]/10 text-[#22C55E] flex items-center gap-0.5">
                        <IconTrendingDown className="w-3 h-3" />
                        {activeData.stats.avgLatency.change}
                      </span>
                      <span className="text-[10px] text-[#94A3B8]">vs prev period</span>
                    </div>
                  </div>
                  <div className="w-20 h-10">
                    <ResponsiveContainer width="100%" height="100%">
                      <LineChart data={latencySparkline}>
                        <Line type="monotone" dataKey="value" stroke="#A855F7" strokeWidth={1.8} dot={false} />
                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>

              {/* Card 3: Error Rate */}
              <div className="bg-[#101524] border border-[rgba(139,92,246,0.15)] rounded-xl p-5 hover:border-[rgba(139,92,246,0.25)] transition-all duration-300 relative overflow-hidden group">
                <div className="flex justify-between items-start mb-4">
                  <span className="text-xs font-semibold tracking-wider text-[#94A3B8] uppercase flex items-center gap-1">

                <div className="flex items-end justify-between">
                  <div>
                    <h3 className="text-2xl font-bold tracking-tight text-white">{activeData.stats.errorRate.value}</h3>
                    <div className="flex items-center gap-1.5 mt-1.5">
                      <span className={`text-xs font-semibold px-1.5 py-0.5 rounded flex items-center gap-0.5 ${
                        activeData.stats.errorRate.isPositive

                          : "bg-[#F43F5E]/10 text-[#F43F5E]"
                      }`}>
                        {activeData.stats.errorRate.isPositive ? <IconTrendingDown className="w-3 h-3" /> : <IconTrendingUp className="w-3 h-3" />}

                    <IconCpu className="w-4 h-4" />

                    <h3 className="text-2xl font-bold tracking-tight text-white">{activeData.stats.tokensConsumed.value}</h3>

                  </div>
                  <div className="w-20 h-10">
                    <ResponsiveContainer width="100%" height="100%">
                      <LineChart data={tokensSparkline}>

                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>

            </section>

            {/* CHARTS ROW 1: Requests & Latency */}

                  <div className="flex items-start justify-between mb-2">
                    <div>
                      <h3 className="text-base font-semibold text-white">Requests per Day</h3>
                      <p className="text-xs text-[#94A3B8]">
                        Total number of requests over the selected time range.
                      </p>
                    </div>
                    <span className="px-2.5 py-1.5 bg-[#121728] border border-[rgba(255,255,255,0.06)] text-xs text-white rounded-md font-medium flex items-center gap-1.5">
                      Total Requests
                      <IconChevronDown className="w-3.5 h-3.5 text-[#94A3B8]" />
                    </span>
                  </div>
                </div>

                <div className="w-full h-72 relative mt-4 animate-fade-in" key={`reqchart-${fadeKey}`}>
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={activeData.requestsChart} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                      <defs>
                        <linearGradient id="requestsBarGradient" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#A78BFA" stopOpacity={1} />
                          <stop offset="25%" stopColor="#8B5CF6" stopOpacity={0.95} />
                          <stop offset="70%" stopColor="#6D3CCF" stopOpacity={0.80} />

                      <XAxis dataKey="name" stroke="#475569" fontSize={11} tickLine={false} axisLine={false} dy={10} />
                      <YAxis stroke="#475569" fontSize={11} tickLine={false} axisLine={false} tickFormatter={formatYAxis} dx={-5} />
                      <Tooltip content={<CustomTooltip />} cursor={{ fill: "rgba(139, 92, 246, 0.04)" }} />
                      <Bar
                        dataKey="value"
                        name="Requests"
                        fill="url(#requestsBarGradient)"
                        shape={<CustomBarShape />}
                        maxBarSize={32}
                        isAnimationActive={true}
                        animationDuration={700}
                        animationEasing="ease-out"
                      />
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* Card: Average Latency */}
              <div className="bg-[#101524] border border-[rgba(255,255,255,0.08)] rounded-xl p-5 flex flex-col justify-between">

                  <div className="flex items-start justify-between mb-2">
                    <div>
                      <h3 className="text-base font-semibold text-white">Average Latency (ms)</h3>
                      <p className="text-xs text-[#94A3B8]">
                        Performance telemetry across servers globally.
                      </p>
                    </div>
                    <span className="px-2.5 py-1.5 bg-[#121728] border border-[rgba(255,255,255,0.06)] text-xs text-white rounded-md font-medium flex items-center gap-1.5">
                      Response Time
                      <IconChevronDown className="w-3.5 h-3.5 text-[#94A3B8]" />
                    </span>
                  </div>
                </div>

                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={activeData.latencyChart} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                      <defs>
                        <linearGradient id="latencyAreaGradient" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#C084FC" stopOpacity={0.28} />
                          <stop offset="30%" stopColor="#8B5CF6" stopOpacity={0.16} />
                          <stop offset="70%" stopColor="#4F46E5" stopOpacity={0.06} />
                          <stop offset="100%" stopColor="#1E1B4B" stopOpacity={0} />
                        </linearGradient>
                        <linearGradient id="latencyDotGradient" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#C084FC" />
                          <stop offset="100%" stopColor="#7C3AED" />
                        </linearGradient>
                        <pattern id="latencyGridPattern" width="14" height="14" patternUnits="userSpaceOnUse">
                          <circle cx="7" cy="7" r="1" fill="#A78BFA" opacity="0.18" />
                        </pattern>
                        <linearGradient id="latencyCursorGradient" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#A855F7" stopOpacity={0.6} />
                          <stop offset="50%" stopColor="#8B5CF6" stopOpacity={0.2} />
                          <stop offset="100%" stopColor="#7C3AED" stopOpacity={0} />

                        <filter id="latencyLineGlow" x="-50%" y="-50%" width="200%" height="200%">

                          <feMerge>
                            <feMergeNode in="coloredBlur" />
                            <feMergeNode in="SourceGraphic" />
                          </feMerge>
                        </filter>
                      </defs>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="rgba(255, 255, 255, 0.04)" />
                      <XAxis dataKey="name" stroke="#475569" fontSize={11} tickLine={false} axisLine={false} dy={10} />
                      <YAxis stroke="#475569" fontSize={11} tickLine={false} axisLine={false} tickFormatter={(val) => `${val}ms`} dx={-5} />
                      <Tooltip cursor={{ stroke: 'url(#latencyCursorGradient)', strokeWidth: 1.5, strokeDasharray: '4 4' }} content={<CustomTooltip />} />
                      
                      <Area
                        type="monotone"
                        dataKey="value"
                        stroke="none"
                        fillOpacity={1}
                        fill="url(#latencyGridPattern)"
                        tooltipType="none"
                        isAnimationActive={true}
                        animationDuration={800}
                        animationEasing="ease-out"
                      />
                      <Area
                        type="monotone"
                        dataKey="value"
                        name="Latency"
                        stroke="#8B5CF6"
                        strokeWidth={2.5}

                        fillOpacity={1}

                            outerRadius={70}

                            {activeData.errorPie.map((entry, index) => {
                              const fillGradient = entry.name === "Errors" ? "url(#errorDonutGradient)" : "url(#successDonutGradient)";
                              return <Cell key={`cell-${index}`} fill={fillGradient} />;
                            })}

                          <Tooltip content={<CustomTooltip />} />
                        </PieChart>
                      </ResponsiveContainer>
                    </div>
                    
                    {/* Center text of Donut */}
                    <div

                      <span className="text-xl font-extrabold text-white drop-shadow-[0_0_12px_rgba(139,92,246,0.4)]">

                      <span className="text-[10px] uppercase font-semibold text-[#94A3B8] tracking-wider mt-0.5">

                      <div>
                        <p className="text-xs font-semibold text-white">Errors</p>
                        <p className="text-[11px] font-medium text-slate-400 mt-1">
                          {activeData.errorAbsolute.toLocaleString()} ({activeData.stats.errorRate.value})
                        </p>
                      </div>
                    </div>

                    <div className="flex items-start gap-3">
                      <span className="w-2.5 h-2.5 rounded-full mt-1 bg-[#22C55E] shadow-[0_0_8px_rgba(34,197,94,0.65)]" />
                      <div>
                        <p className="text-xs font-semibold text-white">Successful</p>
                        <p className="text-[11px] font-medium text-slate-400 mt-1">
                          {activeData.successAbsolute.toLocaleString()} ({(100 - parseFloat(activeData.stats.errorRate.value)).toFixed(2)}%)
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Card: Live Requests */}
              <div className="bg-[#101524] border border-[rgba(255,255,255,0.08)] rounded-xl p-5 lg:col-span-2 flex flex-col justify-between">
                <div className="flex items-start justify-between mb-4">
                  <div>
                    <h3 className="text-base font-semibold text-white">Live Requests (Last 60 Seconds)</h3>
                    <p className="text-xs text-[#94A3B8]">
                      Real-time request activity.
                    </p>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-1.5 bg-[#121728] border border-[rgba(255,255,255,0.06)] text-xs text-white rounded-md font-medium flex items-center gap-1.5 cursor-pointer">
                      Requests
                      <IconChevronDown className="w-3.5 h-3.5 text-[#94A3B8]" />
                    </span>
                    <button className="p-1.5 bg-[#121728] hover:bg-[#151c30] border border-[rgba(255,255,255,0.06)] hover:border-[rgba(139,92,246,0.3)] rounded-md text-[#94A3B8] hover:text-white transition-all">
                      <IconMoreHorizontal className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div ref={liveChartRef} className="w-full h-44 relative">
                  {isLiveChartVisible && (
                    <ResponsiveContainer width="100%" height="100%">
                      <AreaChart data={liveRequestData} margin={{ top: 10, right: 10, left: -25, bottom: 0 }}>
                        <defs>
                          <linearGradient id="liveArea" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#8B5CF6" stopOpacity={0.12} />
                            <stop offset="100%" stopColor="#7C3AED" stopOpacity={0.0} />
                          </linearGradient>
                          <linearGradient id="verticalTrail" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#8B5CF6" stopOpacity={0.4} />
                            <stop offset="35%" stopColor="#8B5CF6" stopOpacity={0.1} />
                            <stop offset="100%" stopColor="#8B5CF6" stopOpacity={0.0} />
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="rgba(255, 255, 255, 0.04)" />
                        <XAxis
                          dataKey="time"
                          stroke="#475569"
                          fontSize={10}
                          tickLine={false}
                          axisLine={false}
                          dy={8}
                          ticks={["12:24:00", "12:24:15", "12:24:30", "12:24:45", "12:25:00"]}
                        />
                        <YAxis
                          stroke="#475569"
                          fontSize={10}
                          tickLine={false}
                          axisLine={false}
                          dx={-5}
                          domain={[0, 100]}
                          ticks={[0, 20, 40, 60, 80, 100]}
                        />
                        <Tooltip content={<CustomTooltip />} />
                        <Area
                          type="monotone"
                          dataKey="value"
                          name="Requests/sec"
                          stroke="#8B5CF6"
                          strokeWidth={1.2}
                          strokeOpacity={0.22}
                          fillOpacity={1}
                          fill="url(#liveArea)"
                          activeDot={{ r: 5, stroke: '#101524', strokeWidth: 1.5, fill: '#8B5CF6' }}
                          dot={<CustomLiveRequestDot />}
                          isAnimationActive={true}
                          animationDuration={1100}
                          animationEasing="ease-out"
                        />
                      </AreaChart>
                    </ResponsiveContainer>

              </div>

            </section>

            {/* INFORMATION FOOTER */}
            <footer className="mt-6 flex flex-col sm:flex-row justify-between items-center py-4 border-t border-[rgba(255,255,255,0.08)] gap-3">
              <div className="flex items-center gap-2 text-[10px] text-[#94A3B8]">
                <IconInfo className="w-3.5 h-3.5 text-[#8B5CF6]" />
                All analytics are based on UTC timezone. Data is refreshed every 30 seconds.
              </div>
              <div className="flex items-center gap-2 text-[10px] text-[#94A3B8]">
                <IconRefreshCw className="w-3.5 h-3.5 text-[#94A3B8]" />
                Last updated: {lastUpdated}
              </div>
            </footer>

          </div>
        </div>
      );
    }

    // Mount the application
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
