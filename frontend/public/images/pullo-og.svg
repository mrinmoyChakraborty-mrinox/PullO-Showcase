<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(124,58,237,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Content -->
  <text x="80" y="240" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="#e2e8f0" letter-spacing="-2">
    Pull<tspan fill="url(#accent)">O</tspan>
  </text>
  <text x="80" y="320" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="url(#title)">
    Private AI Network Layer
  </text>
  <text x="80" y="370" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Turn local models into secure, OpenAI-compatible APIs for your team
  </text>
  <!-- Features -->
  <rect x="80" y="420" rx="8" width="180" height="36" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="170" y="444" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a78bfa" text-anchor="middle">No Tunnels</text>
  <rect x="280" y="420" rx="8" width="200" height="36" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
  <text x="380" y="444" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle">OpenAI Compatible</text>
  <rect x="500" y="420" rx="8" width="180" height="36" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="590" y="444" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle">Team Sharing</text>
  <!-- Logo mark -->
  <circle cx="960" cy="200" r="100" fill="none" stroke="rgba(124,58,237,0.15)" stroke-width="2"/>
  <circle cx="960" cy="200" r="60" fill="none" stroke="rgba(124,58,237,0.2)" stroke-width="2"/>
  <circle cx="960" cy="200" r="25" fill="rgba(124,58,237,0.3)"/>
  <text x="980" y="460" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="end">open source · self-hosted · private</text>
</svg>
