<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06030a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#06030a"/>
  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- High performance wave arcs -->
  <g stroke="url(#waveGrad)" stroke-width="2" fill="none">
    <path d="M -100 600 C 200 400, 400 700, 900 300"/>
    <path d="M -100 650 C 200 450, 400 750, 900 350"/>
    <path d="M -100 700 C 200 500, 400 800, 900 400"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="350" cy="550" r="5" fill="#f472b6" filter="drop-shadow(0 0 10px #f472b6)"/>
  <circle cx="650" cy="400" r="4" fill="#c084fc" filter="drop-shadow(0 0 8px #c084fc)"/>
</svg>
