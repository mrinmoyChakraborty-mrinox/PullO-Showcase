<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f34"/>
      <stop offset="50%" stop-color="#0a071a"/>
      <stop offset="100%" stop-color="#05030b"/>
    </linearGradient>
    <radialGradient id="orb0a" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb0b" cx="70%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
      <circle cx="32" cy="32" r="1.2" fill="rgba(167, 139, 250, 0.15)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg0)"/>
  <rect width="100%" height="100%" fill="url(#orb0a)"/>
  <rect width="100%" height="100%" fill="url(#orb0b)"/>
  <rect width="100%" height="100%" fill="url(#grid0)"/>

  <!-- Ambient Glowing Rings & Neural Rays -->
  <g fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1.5">
    <circle cx="400" cy="500" r="320" stroke-dasharray="8 8"/>
    <circle cx="400" cy="500" r="220"/>
    <path d="M 100 200 Q 400 350 700 200" stroke="rgba(99, 102, 241, 0.2)" stroke-width="2"/>
    <path d="M 150 800 Q 400 650 650 800" stroke="rgba(168, 85, 247, 0.2)" stroke-width="2"/>
  </g>
</svg>
