<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b2e"/>
      <stop offset="50%" stop-color="#05101d"/>
      <stop offset="100%" stop-color="#03070f"/>
    </linearGradient>
    <radialGradient id="orb1a" cx="70%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
